<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4ede0">
  <meta name="description" content="Creative Tools has moved to The Forge. Please update your bookmark.">
  <title>Creative Tools has moved — The Forge</title>
  <!-- Legacy signpost only. No scripts or automatic redirects. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme:light; --paper:#f4ede0; --card:#faf6ec; --graphite:#1f2328; --slate:#2f4562; --muted:#5a574f; --yellow:#f3db7b; }
    *,*::before,*::after { box-sizing:border-box; }
    html { min-height:100%; }
    body {
      min-height:100vh;min-height:100dvh;margin:0;padding:24px;display:grid;place-items:center;
      background:#dfd6c5 radial-gradient(ellipse at 18% 15%,rgba(255,252,244,.8),transparent 65%);
      color:var(--graphite);font-family:'Kalam','Segoe Print',cursive;
    }
    main {
      position:relative;isolation:isolate;width:min(100%,710px);padding:clamp(50px,7vw,80px) clamp(30px,7vw,86px);
      background-color:var(--paper);
      background-image:radial-gradient(circle at 12% 18%,rgba(154,132,98,.11) .65px,transparent 1px),
        radial-gradient(circle at 76% 72%,rgba(154,132,98,.12) .65px,transparent 1px),
        linear-gradient(115deg,rgba(255,254,250,.4),rgba(230,218,195,.1));
      background-size:47px 43px,61px 57px,auto;
      box-shadow:5px 6px 0 rgba(43,45,48,.13);text-align:center;
    }
    main::before {
      content:"";position:absolute;inset:9px;border:1.7px solid rgba(43,45,48,.85);
      border-radius:6px 4px 7px 5px;transform:rotate(-.2deg);pointer-events:none;
    }
    .eyebrow { margin:0 0 18px;color:var(--slate);font:700 12px/1.4 system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase; }
    h1 { margin:0 0 24px;font-size:clamp(46px,9vw,76px);font-weight:700;line-height:1.18;letter-spacing:-.045em;transform:rotate(-.7deg); }
    h1 span { background:linear-gradient(transparent 72%,rgba(243,219,123,.78) 72%,rgba(243,219,123,.78) 90%,transparent 90%); }
    .message { max-width:480px;margin:0 auto 29px;color:var(--muted);font-size:clamp(19px,3vw,24px);line-height:1.5; }
    .message strong { color:var(--graphite);font-weight:700; }
    .new-link {
      display:inline-flex;align-items:center;justify-content:center;gap:12px;max-width:100%;min-height:56px;
      padding:12px 20px;border:1.5px solid var(--graphite);border-radius:4px 7px 5px 6px;background:var(--card);
      color:var(--slate);font:700 clamp(13px,2.7vw,17px)/1.5 system-ui,sans-serif;
      text-underline-offset:4px;overflow-wrap:anywhere;transition:background-color .16s ease,transform .16s ease;
    }
    .new-link:hover { background:#f7e8a7;transform:translateY(-1px); }
    .new-link:focus-visible { outline:3px solid var(--slate);outline-offset:5px; }
    .url { min-width:0;text-decoration:underline; }
    .arrow { flex:0 0 auto;font-size:20px;line-height:1;text-decoration:none; }
    @media(max-width:460px) { body{padding:14px} main{padding:56px 24px} .new-link{width:100%;gap:8px;padding:14px 10px} }
    @media(prefers-reduced-motion:reduce) { .new-link{transition:none} .new-link:hover{transform:none} }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Creative Tools · Address update</p>
    <h1><span>The Forge</span></h1>
    <p class="message"><strong>You're using an old link.</strong> Please remove your old bookmark and use the new link below.</p>
    <a class="new-link" href="https://kotaru27.github.io/The-Forge/">
      <span class="url">https://kotaru27.github.io/The-Forge/</span>
      <span class="arrow" aria-hidden="true">↗</span>
    </a>
  </main>
</body>
</html>
